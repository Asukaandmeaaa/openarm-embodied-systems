# Closed-transit ACT; legacy filename retained. Explicit closed zero handoff required.
nodes:
  - id: trial-bridge
    path: ../../scripts/act_trial/run_node.sh
    args: bridge
    inputs:
      tick: dora/timer/millis/10
      policy_actions: policy-server/actions
      timing_fault: policy-server/timing_fault
    outputs:
      - position_right
      - position_left
      - status_right
      - status_left
      - observer_command
      - task_prompt
      - trial_status
      - execution_stop

  - id: camera-wrist-right
    path: ../../scripts/act_trial/run_node.sh
    args: camera
    env:
      CAMERA_ROLE: wrist_right
      CAPTURE_WIDTH: "640"
      CAPTURE_HEIGHT: "480"
      # This device advertises MJPG 640x480 at 60 fps; publish latest at 30 Hz.
      CAPTURE_FPS: "60"
      CAPTURE_FOURCC: MJPG
      CAPTURE_PATH: /dev/v4l/by-id/usb-DCX-250107-ZW_DECXIN-video-index0
      ENCODING: jpeg
      IMAGE_HEIGHT: "480"
      IMAGE_WIDTH: "640"
      JPEG_QUALITY: "90"
    inputs:
      tick: dora/timer/millis/33
    outputs: [image]

  - id: camera-ceiling
    path: ../../scripts/act_trial/run_node.sh
    args: camera
    env:
      CAMERA_ROLE: ceiling
      CAPTURE_WIDTH: "640"
      CAPTURE_HEIGHT: "480"
      CAPTURE_FPS: "30"
      CAPTURE_FOURCC: YUYV
      CAPTURE_PATH: realsense:344322073972
      ENCODING: jpeg
      IMAGE_HEIGHT: "480"
      IMAGE_WIDTH: "640"
      JPEG_QUALITY: "90"
    inputs:
      tick: dora/timer/millis/33
    outputs: [image]

  - id: observer
    path: .venv/bin/dora-openarm-observer
    args: --arms right,left --cameras camera_wrist_right,camera_ceiling --max-source-age-ms 200 --max-source-skew-ms 100
    inputs:
      tick: dora/timer/millis/33
      arm_right: trial-bridge/position_right
      arm_left: trial-bridge/position_left
      camera_wrist_right: camera-wrist-right/image
      camera_ceiling: camera-ceiling/image
      command: trial-bridge/observer_command
      arm_right_status: trial-bridge/status_right
      arm_left_status: trial-bridge/status_left
      task_prompt: trial-bridge/task_prompt
    outputs: [observation]

  - id: policy-server
    path: ../../scripts/act_trial/run_node.sh
    args: policy-client
    env:
      REQUIRE_SOURCE_TIMING: "yes"
      MAX_SOURCE_AGE_MS: "200"
      MAX_SOURCE_SKEW_MS: "100"
      MAX_OBSERVATION_AGE_MS: "500"
    inputs:
      observation: observer/observation
      execution_stop: trial-bridge/execution_stop
    outputs: [actions, timing_fault]
