# Official OpenArm ACT/MuJoCo baseline.
#
# This preserves actuator physics while matching the released checkpoint's
# inactive-left-gripper observation contract.  Full chunks are executed to
# prevent slow GPU inference from repeatedly cancelling each chunk near its
# beginning.  The existing locally modified dataflow remains untouched.

nodes:
  - id: observer
    build: pip install -e nodes/dora-openarm-observer
    path: dora-openarm-observer
    args: "--arms right,left"
    inputs:
      tick: quittable-tick-observer/tick
      arm_right: mujoco-collect/arm_right_observation
      arm_left: mujoco-collect/arm_left_observation
      camera_wrist_right: mujoco-collect/camera_wrist_right
      camera_wrist_left: mujoco-collect/camera_wrist_left
      camera_head_left: mujoco-collect/camera_head_left
      camera_head_right: mujoco-collect/camera_head_right
      camera_ceiling: mujoco-collect/camera_ceiling
      command: mujoco-collect/status
    outputs:
      - observation

  - id: quittable-tick-observer
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - tick

  - id: quittable-observer
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      observation: observer/observation
    outputs:
      - observation

  - id: policy-server
    build: pip install -e nodes/dora-openarm-local-policy-server
    path: dora-openarm-local-policy-server
    args: "--execute-full-chunk"
    env:
      SOCKET: /dev/shm/policy-server.socket
    inputs:
      observation: quittable-observer/observation
    outputs:
      - actions

  - id: actions-executor
    build: pip install -e nodes/dora-openarm-actions-executor
    path: dora-openarm-actions-executor
    args: "--upsample --filter"
    inputs:
      actions: policy-server/actions
    outputs:
      - move_position_right
      - move_position_left

  - id: mujoco-collect
    build: pip install -e nodes/dora-openarm-mujoco
    path: dora-openarm-mujoco
    # Keep MuJoCo physics enabled.  Pinning only the inactive left gripper
    # repairs the checkpoint/MJCF mismatch while leaving the right task arm and
    # orange cube dynamic.  PICK logs provide an objective lift measurement.
    args: "--scene demo --keyframe home --enable-collision --ctrl --pin-left-gripper 0.785 --debug-pick-body orange_cube --viewer --render"
    inputs:
      position_left: actions-executor/move_position_left
      position_right: actions-executor/move_position_right
    outputs:
      - status
      - arm_right_observation
      - arm_left_observation
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
      - episode_metadata
