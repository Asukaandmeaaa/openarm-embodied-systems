# Isolated right ACT experiment. Profile is sealed in trial_config.json:
# commissioning (3s arm only) or task (right arm and gripper until manual stop/fault).
# ROS must already hold the verified HOME pose.
# This graph never starts hardware drivers, enables motors, or performs HOME.
# ROS owns both CAN interfaces and supplies the unchanged gravity compensation.
# Requires the reviewed DDS Security Enforce environment and the resident
# scripts/control_ownership gateway. The bridge has no raw ROS publisher.
# Acquire Dora authority only at explicit START after H2 releases its lease.
# ACT_TRIAL_DIR and SOCKET are inherited from the prepared trial environment.
# The separate logged policy server must be ready before starting this graph.
nodes:
  - id: trial-bridge
    path: ../../scripts/act_trial/run_node.sh
    args: bridge
    inputs:
      tick: dora/timer/millis/10
      shaped_action: actions-executor/move_position_right
      timing_fault: actions-executor/timing_fault
    outputs:
      - position_right
      - position_left
      - status_right
      - status_left
      - observer_command
      - task_prompt
      - trial_status
      - execution_stop

  - id: camera-wrist-right
    path: ../../scripts/act_trial/run_node.sh
    args: camera
    env:
      CAMERA_ROLE: wrist_right
      CAPTURE_WIDTH: "1280"
      CAPTURE_HEIGHT: "720"
      CAPTURE_FPS: "60"
      CAPTURE_FOURCC: MJPG
      CAPTURE_PATH: /dev/v4l/by-id/usb-DCX-250107-ZW_DECXIN-video-index0
      ENCODING: jpeg
      IMAGE_HEIGHT: "360"
      IMAGE_WIDTH: "640"
      JPEG_QUALITY: "90"
    inputs:
      tick: dora/timer/millis/33
    outputs: [image]

  - id: camera-ceiling
    path: ../../scripts/act_trial/run_node.sh
    args: camera
    env:
      CAMERA_ROLE: ceiling
      CAPTURE_WIDTH: "640"
      CAPTURE_HEIGHT: "360"
      CAPTURE_FPS: "30"
      CAPTURE_FOURCC: YUYV
      # Interface1.3 is this workstation's RGB sensor. The by-id index2 is IR.
      CAPTURE_PATH: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:3.2:1.3-video-index0
      ENCODING: jpeg
      IMAGE_HEIGHT: "360"
      IMAGE_WIDTH: "640"
      JPEG_QUALITY: "90"
    inputs:
      tick: dora/timer/millis/33
    outputs: [image]

  - id: observer
    path: .venv/bin/dora-openarm-observer
    args: --arms right,left --cameras camera_wrist_right,camera_ceiling --max-source-age-ms 200 --max-source-skew-ms 100
    inputs:
      tick: dora/timer/millis/33
      arm_right: trial-bridge/position_right
      arm_left: trial-bridge/position_left
      camera_wrist_right: camera-wrist-right/image
      camera_ceiling: camera-ceiling/image
      command: trial-bridge/observer_command
      arm_right_status: trial-bridge/status_right
      arm_left_status: trial-bridge/status_left
      task_prompt: trial-bridge/task_prompt
    outputs: [observation]

  - id: policy-server
    # Infer only after all ten prefix slots complete, using a newer observation.
    path: ../../scripts/act_trial/run_node.sh
    args: policy-client
    env:
      REQUIRE_SOURCE_TIMING: "yes"
      MAX_SOURCE_AGE_MS: "200"
      MAX_SOURCE_SKEW_MS: "100"
      MAX_OBSERVATION_AGE_MS: "500"
    inputs:
      observation: observer/observation
      chunk_complete: actions-executor/chunk_complete
      execution_stop: trial-bridge/execution_stop
    outputs: [actions, timing_fault]

  - id: actions-executor
    path: ../../scripts/act_trial/run_node.sh
    # Retain Hermite/lowpass; execute ten steps without old-tail mixing.
    args: executor --arms right --upsample --filter --control-hz 100
    env:
      REQUIRE_SOURCE_TIMING: "yes"
      MAX_SOURCE_AGE_MS: "200"
      MAX_SOURCE_SKEW_MS: "100"
      MAX_OBSERVATION_AGE_MS: "500"
    inputs:
      actions: policy-server/actions
      timing_fault: policy-server/timing_fault
      execution_stop: trial-bridge/execution_stop
    outputs: [move_position_right, timing_fault, chunk_complete]
