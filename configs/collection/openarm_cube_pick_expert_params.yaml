task: Pick up the blue cube, hold it for 2 seconds, place it nearby, and return the right arm home.
physics_hz: 1000
record_hz: 30
episode_timeout_s: 35.0
stabilize_s: 0.8
cube_xy_center_m: [0.33, -0.28]
cube_xy_half_range_m: [0.05, 0.06]
place_xy_half_range_m: [0.055, 0.065]
place_min_distance_m: 0.08
place_tolerance_m: 0.035
place_height_tolerance_m: 0.025
transport_step_m: 0.01
transport_waypoint_s: 0.05
retreat_waypoint_s: 0.03
retreat_m: 0.08
stream_waypoint_s: 0.025
stream_settle_s: 0.45
return_settle_s: 0.90
approach_waypoint_s: 0.055
approach_settle_s: 0.80
close_timeout_s: 1.2
release_s: 0.7
pregrasp_offset_m: 0.07
approach_step_m: 0.005
lift_m: 0.065
support_clearance_m: 0.008
# MuJoCo collision sweep: keeps the lowest right-hand collision mesh 8 mm
# above the 1.005 m support while the fingers overlap the 40 mm cube.
grasp_center_z_offset_m: 0.035
aperture_preload_m: 0.002
object_width_m: 0.040
finger_contact_radius_m: 0.070
reference_width_m: 0.040
reference_right_gripper_rad: -0.10
pregrasp_right_gripper_rad: -0.55
# Keep the fingers fully open throughout Cartesian descent. The frozen G2-v1
# window showed 12/20 cubes displaced before CLOSE with the former -0.25 rad;
# A/B seeds 20260903, 20260910 and 20260902 all passed with -0.55 rad.
approach_right_gripper_rad: -0.55
hold_height_m: 0.05
# Collection acceptance is intentionally stricter than the 1.0 s task gate.
# The extra margin prevents a trajectory that only succeeds at its final frame
# from failing under small deterministic replay differences.
hold_s: 2.0
tcp_distance_m: 0.075
planning_timeout_s: 30.0
ik_attempts: 10
# MuJoCo fixed-seed reachability probe for the reference cube pose. It is only
# an IK initial guess; every returned solution must still satisfy FK/collision.
ik_reference_seed: [-0.84, 2.79, -0.48, 2.12, -0.44, -0.09, -0.17]
ik_iterations: 250
ik_position_tolerance_m: 0.0015
ik_orientation_tolerance_rad: 0.02
joint_margin_rad: 0.020
transit_joint_step_rad: 0.015
max_ik_branch_jump_rad: 0.35
verify_contact_s: 0.20
max_relative_drift_m: 0.025
guard:
  watchdog_timeout_s: 0.15
  limit_policy: clip
  # Position-error response horizon. The old implicit 1 ms horizon combined
  # with acceleration clipping produced a 2--3 Hz limit cycle around every
  # fixed waypoint, including HOLD and the stationary left arm.
  target_response_time_s: 0.25
  max_velocity: [0.65, 0.65, 0.65, 0.65, 0.65, 0.50, 0.50, 0.25, 0.65, 0.65, 0.65, 0.65, 0.65, 0.50, 0.50, 0.25]
  max_acceleration: [2.5, 2.5, 2.5, 2.5, 2.5, 2.0, 2.0, 0.8, 2.5, 2.5, 2.5, 2.5, 2.5, 2.0, 2.0, 0.8]
  max_step: [0.003, 0.003, 0.003, 0.003, 0.003, 0.0025, 0.0025, 0.0004, 0.003, 0.003, 0.003, 0.003, 0.003, 0.0025, 0.0025, 0.0004]
