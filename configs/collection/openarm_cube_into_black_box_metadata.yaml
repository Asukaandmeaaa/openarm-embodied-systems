location: MuJoCo demo cell, black box moved to middle for this task
operator: local
task_contract: openarm_cube_into_black_box_v3
tasks:
  - prompt: Put the blue cube inside the black box, then return both arms home.
    description: Start from home, pick up the blue cube with the right arm, hold it for 2 seconds, place it inside the fixed middle black box, release it, and return both arms home.
equipment:
  id: OpenArm-MuJoCo
  version: "2.0"
  embodiments:
    arms:
      id: OpenArm
      version: "2.0"
      state_action_order: [right_joint1..7, right_gripper, left_joint1..7, left_gripper]
  perceptions:
    cameras:
      ceiling: {source: camera_ceiling, encoding: jpeg, color_after_decode: RGB, resolution: [960, 600]}
      wrist_right: {source: camera_wrist_right, encoding: jpeg, color_after_decode: RGB, resolution: [960, 600]}
collection:
  target_fps: 30
  object_xy_randomization_m: [0.05, 0.04]
  object_color: blue
  object_yaw_randomization_deg: 15
  black_box_center_xy_m: [0.40, 0.0]
  black_box_source_center_xy_m: [0.47, 0.15]
  black_box_fixed: true
  left_arm: restored_and_loaded
  collision: enabled
  control: actuator_position
