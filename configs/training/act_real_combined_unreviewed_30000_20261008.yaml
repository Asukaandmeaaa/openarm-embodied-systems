# Exploratory 30K comparison run on the same 36-episode combined dataset.
# Includes pending episodes and has no validation split; compare with the 20K
# run using the same real-robot evaluation protocol.
dataset:
  repo_id: local/openarm_real_combined_unreviewed_20261008
  root: ./data/lerobot/openarm_real_combined_unreviewed_20261008
  eval_split: 0.0
  image_transforms:
    enable: false
policy:
  type: act
  device: cuda
  push_to_hub: false
  chunk_size: 50
  n_action_steps: 10
  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: IDENTITY
    ACTION: MEAN_STD
output_dir: ./outputs/act_real_combined_unreviewed_30000_20261008
job_name: act_real_combined_unreviewed_30000_20261008
batch_size: 8
steps: 30000
num_workers: 4
prefetch_factor: 2
seed: 1000
cudnn_deterministic: true
log_freq: 50
eval_steps: 0
env_eval_freq: 0
save_checkpoint: true
save_freq: 500
wandb:
  enable: false
