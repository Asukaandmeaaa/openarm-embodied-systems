name: Offline contracts and simulation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked baseline
        run: |
          python -m pip install uv==0.12.3
          uv sync --frozen
      - name: Contract tests
        run: make test
      - name: Headless physics smoke
        run: make smoke
      - name: Simulation collection and recovery contracts
        run: make test-sim-mix
      - name: Independent simulation expert smoke
        run: make smoke-sim-mix
